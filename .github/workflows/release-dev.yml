name: Release (dev)

on:
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags: build.sh needs them for changelog generation,
          # release notes, and duplicate-tag detection.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: yarn
          cache-dependency-path: src/frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: yarn install --frozen-lockfile

      # Tests run before build.sh, so a failing test stops the release
      # before it tags, commits or publishes anything.
      - name: Test frontend
        working-directory: src/frontend
        run: |
          yarn lint
          yarn type-check
          yarn test:run

      - name: Install GraphQL backend dependencies
        working-directory: packages/unraid-api-plugin-docker-folders
        # vendor/ is gitignored. build.sh skips both steps when they are done.
        run: |
          ./scripts/vendor-unraid-shared.sh release
          npm ci --no-audit --no-fund

      - name: Test GraphQL backend
        working-directory: packages/unraid-api-plugin-docker-folders
        run: |
          npm run type-check
          npm test

      - name: Test PHP backend
        run: tests/php/run.sh

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Seed archive directory from existing tags
        # archive/*.txz is gitignored, but build.sh derives the next same-day
        # build number from files in archive/. Recreate empty placeholders for
        # every released version so auto-increment works in a fresh checkout.
        run: |
          mkdir -p archive
          for tag in $(git tag -l 'v*'); do
            touch "archive/unraid-docker-folders-modern-${tag#v}.txz"
          done

      # The only step that holds ANTHROPIC_API_KEY. It runs no dependency code:
      # release-notes.sh uses git, jq and curl. build.sh runs yarn and npm
      # installs, whose lifecycle scripts would see any secret in its env.
      # Without the key, release-notes.sh sorts commits by prefix.
      - name: Write release notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: build/release-notes.sh generate "$(build/release-notes.sh range)" > "$RUNNER_TEMP/release-notes.json"

      - name: Build and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_JSON: ${{ runner.temp }}/release-notes.json
        run: ./build/build.sh --release
